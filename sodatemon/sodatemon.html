<title>そだてもん</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

  :root{
    --paper:#f5f0e1;
    --paper-line:#cfd3bf;
    --ink:#2b2620;
    --ink-soft:#6b6355;
    --panel:#fffdf6;
    --rule:#d8d2bd;
    --accent:#b1402a;
    --accent-ink:#fffaf0;
    --growth:#5c7a52;
    --growth-soft:#dfe8d6;
    --gold:#b6892f;
    --eng:#3f5583;
    --math:#a2672b;
    --soc:#3f7a52;
    --shadow-c: 43 38 32;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#201e19;
      --paper-line:#3a362c;
      --ink:#ece6d6;
      --ink-soft:#a89e88;
      --panel:#2a2720;
      --rule:#423d31;
      --accent:#e07350;
      --accent-ink:#241208;
      --growth:#7fa06e;
      --growth-soft:#33402c;
      --gold:#d6ac57;
      --eng:#8fa2d6;
      --math:#d6a35f;
      --soc:#7fbd8c;
      --shadow-c: 0 0 0;
    }
  }
  :root[data-theme="dark"]{
    --paper:#201e19;
    --paper-line:#3a362c;
    --ink:#ece6d6;
    --ink-soft:#a89e88;
    --panel:#2a2720;
    --rule:#423d31;
    --accent:#e07350;
    --accent-ink:#241208;
    --growth:#7fa06e;
    --growth-soft:#33402c;
    --gold:#d6ac57;
    --eng:#8fa2d6;
    --math:#d6a35f;
    --soc:#7fbd8c;
    --shadow-c: 0 0 0;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/28px 100%,
      var(--paper);
    background-attachment:local;
    color:var(--ink);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  .display{ font-family:'Yuji Syuku','Zen Maru Gothic',serif; }
  button{ font-family:inherit; }
  :focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  .page{ max-width:980px; margin:0 auto; padding:28px 20px 60px; }

  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; padding-bottom:14px; border-bottom:2px solid var(--rule);
    margin-bottom:22px; flex-wrap:wrap;
  }
  .masthead h1{ font-size:clamp(28px,4vw,38px); letter-spacing:.02em; }
  .masthead .stamp-mark{
    display:inline-block; color:var(--accent); border:2.5px solid var(--accent);
    border-radius:50%; width:1.5em; height:1.5em; line-height:1.4em;
    text-align:center; font-size:.55em; transform:rotate(-8deg);
    margin-left:8px; vertical-align:middle;
  }
  .masthead .sub{ font-size:13px; color:var(--ink-soft); letter-spacing:.04em; }

  .layout{ display:grid; grid-template-columns:300px 1fr; gap:22px; align-items:start; }
  @media (max-width:760px){ .layout{ grid-template-columns:1fr; } }

  .obs-card{
    background:var(--panel); border:1px solid var(--rule); border-radius:10px;
    padding:18px; box-shadow:0 1px 0 rgba(var(--shadow-c)/.06);
    position:sticky; top:20px;
  }
  @media (max-width:760px){ .obs-card{ position:static; } }

  .obs-label{ font-size:11px; letter-spacing:.14em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:2px; }
  .obs-name{ font-family:'Yuji Syuku',serif; font-size:26px; margin-bottom:10px; }

  .creature-stage{ display:flex; justify-content:center; padding:6px 0 4px; }
  .creature-stage svg{ width:180px; height:150px; overflow:visible; }
  .creature{ animation:bob 3.6s ease-in-out infinite; transform-origin:100px 150px; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

  .c-shadow{ fill:rgba(var(--shadow-c)/.14); }
  .c-egg{ fill:var(--growth-soft); stroke:var(--growth); stroke-width:2; }
  .c-crack{ stroke:var(--growth); stroke-width:2.4; stroke-linecap:round; }
  .c-torso{ fill:var(--growth-soft); stroke:var(--growth); stroke-width:2.2; transition:transform .3s; }
  .c-eye{ fill:var(--ink); }
  .c-mouth{ stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; }
  .c-cheek{ fill:var(--accent); opacity:.35; }
  .c-leaf path{ fill:var(--growth); }
  .c-crown path{ fill:var(--gold); }

  .creature[data-stage="0"] .c-body{ display:none; }
  .creature[data-stage="0"] .c-egg{ display:block; }
  .creature:not([data-stage="0"]) .c-egg{ display:none; }
  .creature[data-stage="1"] .c-torso{ transform:scale(.82); }
  .creature[data-stage="2"] .c-torso{ transform:scale(.94); }
  .creature[data-stage="3"] .c-torso{ transform:scale(1.02); }
  .creature[data-stage="4"] .c-torso{ transform:scale(1.1); }
  .c-leaf2,.c-leaf3,.c-crown{ display:none; }
  .creature[data-stage="2"] .c-leaf2,.creature[data-stage="3"] .c-leaf2,.creature[data-stage="4"] .c-leaf2{ display:block; }
  .creature[data-stage="3"] .c-leaf3,.creature[data-stage="4"] .c-leaf3{ display:block; }
  .creature[data-stage="4"] .c-crown{ display:block; }

  .stage-caption{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  .exp-row{ margin-top:14px; }
  .exp-row .meta{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:4px; font-variant-numeric:tabular-nums; }
  .exp-track{ height:9px; border-radius:5px; background:var(--growth-soft); border:1px solid var(--rule); overflow:hidden; }
  .exp-fill{ height:100%; background:linear-gradient(90deg,var(--growth),var(--gold)); transition:width .4s ease; border-radius:5px; }

  .stats-grid{ margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat{ border-top:1px solid var(--rule); padding-top:6px; }
  .stat .n{ font-variant-numeric:tabular-nums; font-size:19px; font-weight:700; }
  .stat .l{ font-size:11px; color:var(--ink-soft); }

  .stamp-log{ margin-top:16px; }
  .stamp-log .obs-label{ margin-bottom:6px; }
  .stamp-row{ display:flex; gap:6px; overflow-x:auto; padding:4px 2px 8px; }
  .stamp{
    flex:0 0 auto; width:30px; height:30px; border:2.5px solid var(--accent); color:var(--accent);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; font-family:'Yuji Syuku',serif;
  }
  .stamp.empty{ border-style:dashed; border-color:var(--rule); color:var(--rule); }
  .stamp-pop{ animation:pop .35s ease; }
  @keyframes pop{ 0%{ transform:scale(.3) rotate(-25deg); opacity:0;} 70%{ transform:scale(1.15) rotate(-8deg);} 100%{ transform:scale(1) rotate(-8deg);} }

  .quiz-wrap{ display:flex; gap:0; }
  .tabs{ display:flex; flex-direction:column; gap:8px; padding-top:30px; }
  @media (max-width:760px){ .quiz-wrap{ flex-direction:column; } .tabs{ flex-direction:row; padding-top:0; margin-bottom:10px; overflow-x:auto; } }
  .tab{
    border:1px solid var(--rule); border-right:none; background:var(--panel); color:var(--ink-soft);
    padding:9px 10px; font-size:12.5px; letter-spacing:.03em; border-radius:8px 0 0 8px;
    cursor:pointer; text-align:right; white-space:nowrap;
  }
  @media (max-width:760px){ .tab{ border-right:1px solid var(--rule); border-bottom:none; border-radius:8px 8px 0 0; text-align:center; } }
  .tab[aria-selected="true"]{ color:var(--ink); font-weight:700; box-shadow:inset 3px 0 0 var(--tab-c,var(--accent)); }
  .tab[data-k="all"]{ --tab-c:var(--accent); }
  .tab[data-k="eng"]{ --tab-c:var(--eng); }
  .tab[data-k="math"]{ --tab-c:var(--math); }
  .tab[data-k="soc"]{ --tab-c:var(--soc); }

  .notebook{ flex:1; background:var(--panel); border:1px solid var(--rule); border-radius:0 10px 10px 10px; padding:22px; min-height:360px; }
  @media (max-width:760px){ .notebook{ border-radius:0 0 10px 10px; } }

  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:12px; }
  .chip-row.with-rule{ border-bottom:1px dashed var(--rule); }
  .chip-row[hidden]{ display:none; }
  .chip-row-label{ flex:0 0 auto; font-size:11px; letter-spacing:.1em; color:var(--ink-soft); align-self:center; text-transform:uppercase; padding-right:2px; }
  .unit-chip{
    flex:0 0 auto; border:1.5px solid var(--rule); background:transparent; color:var(--ink-soft);
    padding:6px 13px; border-radius:20px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .unit-chip[aria-pressed="true"]{
    border-color:var(--chip-c,var(--accent)); color:var(--ink);
    background:color-mix(in srgb, var(--chip-c,var(--accent)) 14%, transparent); font-weight:700;
  }

  .qhead{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft); margin-bottom:10px; flex-wrap:wrap; }
  .qhead .chip{ font-size:11px; border:1px solid var(--rule); border-radius:20px; padding:2px 9px; color:var(--ink); font-weight:700; }
  .qtext{ font-size:20px; line-height:1.5; margin:6px 0 18px; padding-left:14px; border-left:3px solid var(--rule); }

  .choices{ display:grid; gap:10px; }
  .choice{
    text-align:left; padding:13px 16px; border:1.5px solid var(--rule); border-radius:9px;
    background:transparent; color:var(--ink); font-size:15.5px; cursor:pointer;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .choice:hover:not(:disabled){ border-color:var(--accent); }
  .choice:active:not(:disabled){ transform:scale(.99); }
  .choice:disabled{ cursor:default; }
  .choice.correct{ border-color:var(--growth); background:var(--growth-soft); font-weight:700; }
  .choice.wrong{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); }

  .feedback{ margin-top:16px; padding:12px 14px; border-radius:9px; font-size:14.5px; display:none; flex-direction:column; gap:8px; }
  .feedback.show{ display:flex; }
  .feedback.ok{ background:var(--growth-soft); color:var(--ink); }
  .feedback.ng{ background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--ink); }
  .feedback .fline{ display:flex; align-items:center; gap:10px; }
  .feedback .fstamp{
    flex:0 0 auto; width:26px;height:26px;border-radius:50%; border:2px solid currentColor;
    display:flex;align-items:center;justify-content:center; font-family:'Yuji Syuku',serif; font-size:12px;
  }
  .feedback .explain{ font-size:13px; color:var(--ink-soft); padding-left:36px; line-height:1.6; }
  .feedback .explain b{ color:var(--ink); font-weight:700; letter-spacing:.06em; }

  .next-btn{
    margin-top:16px; background:var(--accent); color:var(--accent-ink); border:none;
    padding:11px 22px; border-radius:8px; font-size:14.5px; font-weight:700; cursor:pointer; display:none;
  }
  .next-btn.show{ display:inline-flex; align-items:center; gap:6px; }
  .next-btn:hover{ filter:brightness(1.06); }

  .evolve-toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:10px; font-size:14px;
    opacity:0; transition:opacity .3s, transform .3s; pointer-events:none; text-align:center;
  }
  .evolve-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .addq{ margin-top:24px; border-top:1px dashed var(--rule); padding-top:14px; }
  .addq summary{ cursor:pointer; font-size:13px; color:var(--ink-soft); letter-spacing:.03em; }
  .addq-form{ margin-top:12px; display:grid; gap:8px; max-width:520px; }
  .addq-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .addq-row > div{ flex:1; min-width:120px; display:flex; flex-direction:column; gap:4px; }
  .addq-form input[type="text"], .addq-form select{
    font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--rule);
    border-radius:6px; background:var(--paper); color:var(--ink);
  }
  .addq-choice{ display:flex; align-items:center; gap:8px; }
  .addq-choice input[type="text"]{ flex:1; }
  .addq-form button{
    justify-self:start; background:transparent; border:1.5px solid var(--growth); color:var(--growth);
    padding:8px 16px; border-radius:7px; font-weight:700; cursor:pointer; font-size:13.5px;
  }
  .addq-note{ font-size:11.5px; color:var(--ink-soft); }

  .custom-list{ margin-top:20px; max-width:600px; }
  .custom-list-head{ font-size:11px; letter-spacing:.1em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px; }
  .custom-items{ display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; }
  .custom-item{
    display:flex; align-items:center; gap:10px; border:1px solid var(--rule); border-radius:8px;
    padding:8px 10px; font-size:12.5px;
  }
  .custom-item .meta{ flex:0 0 auto; color:var(--ink-soft); font-size:11px; white-space:nowrap; }
  .custom-item .txt{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .custom-item .del{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--accent);
    color:var(--accent); background:transparent; cursor:pointer; font-size:12px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .custom-item .del:hover{ background:color-mix(in srgb, var(--accent) 16%, transparent); }
  .custom-empty{ font-size:12.5px; color:var(--ink-soft); }
</style>

<div class="page">

  <header class="masthead">
    <div>
      <h1 class="display">そだてもん<span class="stamp-mark">合</span></h1>
      <div class="sub">自由研究ノート風・学習育成ゲーム（小6復習〜中3対応）</div>
    </div>
    <div class="sub">えいご ／ すうがく ／ しゃかい・りか</div>
  </header>

  <div class="layout">

    <aside class="obs-card">
      <div class="obs-label">観察カード No.01</div>
      <div class="obs-name" id="stageName">たまご</div>

      <div class="creature-stage">
        <svg class="creature" id="creature" data-stage="0" viewBox="0 0 200 160" role="img" aria-label="そだてもんのすがた">
          <ellipse class="c-shadow" cx="100" cy="150" rx="52" ry="9"></ellipse>
          <g class="c-egg">
            <path d="M100 38 C132 38 147 80 147 110 C147 138 126 150 100 150 C74 150 53 138 53 110 C53 80 68 38 100 38 Z"></path>
            <path class="c-crack" d="M84 68 L96 84 L88 96 L102 114" fill="none"></path>
          </g>
          <g class="c-body">
            <g class="c-leaf c-leaf2"><path d="M74 80 C58 72 52 56 58 42 C71 52 79 64 74 80 Z"></path></g>
            <g class="c-leaf c-leaf3"><path d="M126 80 C142 72 148 56 142 42 C129 52 121 64 126 80 Z"></path></g>
            <g class="c-crown">
              <path d="M100 40 C93 26 96 14 105 6 C106 20 104 32 100 40 Z"></path>
              <path d="M82 46 C70 36 66 22 72 10 C82 20 88 34 82 46 Z"></path>
              <path d="M118 46 C130 36 134 22 128 10 C118 20 112 34 118 46 Z"></path>
            </g>
            <g class="c-leaf c-leaf1"><path d="M100 66 C90 48 96 32 110 24 C108 42 106 58 100 66 Z"></path></g>
            <ellipse class="c-torso" cx="100" cy="110" rx="46" ry="40"></ellipse>
            <circle class="c-eye" cx="84" cy="102" r="5.5"></circle>
            <circle class="c-eye" cx="116" cy="102" r="5.5"></circle>
            <ellipse class="c-cheek" cx="76" cy="114" rx="7" ry="5"></ellipse>
            <ellipse class="c-cheek" cx="124" cy="114" rx="7" ry="5"></ellipse>
            <path class="c-mouth" d="M90 120 Q100 128 110 120" fill="none"></path>
          </g>
        </svg>
      </div>
      <div class="stage-caption" id="stageCaption">問題に答えると、うまれるよ</div>

      <div class="exp-row">
        <div class="meta"><span>けいけんち</span><span id="expText">0 / 15</span></div>
        <div class="exp-track"><div class="exp-fill" id="expFill" style="width:0%"></div></div>
      </div>

      <div class="stats-grid">
        <div class="stat"><div class="n" id="statCorrect">0</div><div class="l">せいかい数</div></div>
        <div class="stat"><div class="n" id="statTotal">0</div><div class="l">かいとう数</div></div>
        <div class="stat"><div class="n" id="statStreak">0</div><div class="l">れんぞく正解</div></div>
        <div class="stat"><div class="n" id="statRate">0%</div><div class="l">せいかい率</div></div>
      </div>

      <div class="stamp-log">
        <div class="obs-label">きょうのスタンプ</div>
        <div class="stamp-row" id="stampRow"></div>
      </div>
    </aside>

    <div class="quiz-wrap">
      <div class="tabs" role="tablist" aria-label="教科をえらぶ">
        <button class="tab" role="tab" data-k="all" aria-selected="true">全教科<br>ミックス</button>
        <button class="tab" role="tab" data-k="eng" aria-selected="false">英単語</button>
        <button class="tab" role="tab" data-k="math" aria-selected="false">数学</button>
        <button class="tab" role="tab" data-k="soc" aria-selected="false">社会・理科</button>
      </div>

      <div class="notebook">
        <div class="chip-row with-rule" id="gradeRow"></div>
        <div class="chip-row with-rule" id="unitRow" hidden></div>

        <div class="qhead">
          <span class="chip" id="subjectChip">全教科</span>
          <span>ノート p.<span id="qIndex">1</span></span>
        </div>
        <div class="qtext" id="qText">読みこみ中…</div>
        <div class="choices" id="choices"></div>

        <div class="feedback" id="feedback">
          <div class="fline"><span class="fstamp" id="fstamp">合</span><span id="feedbackText"></span></div>
          <div class="explain" id="explainText"></div>
        </div>

        <button class="next-btn" id="nextBtn">つぎの問題へ ▶</button>

        <details class="addq">
          <summary>＋ じぶんの問題をノートに追加する</summary>
          <form class="addq-form" id="addqForm">
            <div class="addq-row">
              <div>
                <label class="addq-note">教科</label>
                <select id="addqSubject">
                  <option value="eng">英単語</option>
                  <option value="math">数学</option>
                  <option value="soc">社会・理科</option>
                </select>
              </div>
              <div>
                <label class="addq-note">学年</label>
                <select id="addqGrade">
                  <option value="小6">小6（復習）</option>
                  <option value="中1">中1</option>
                  <option value="中2">中2</option>
                  <option value="中3">中3</option>
                </select>
              </div>
              <div>
                <label class="addq-note">単元</label>
                <select id="addqUnit"></select>
              </div>
            </div>
            <label class="addq-note">問題文</label>
            <input type="text" id="addqText" placeholder="例：光合成が行われる場所は？" required>
            <label class="addq-note">選択肢（1つ目が正解になります・表示順はシャッフルされます）</label>
            <div class="addq-choice"><input type="text" placeholder="正解の選択肢" required></div>
            <div class="addq-choice"><input type="text" placeholder="選択肢2" required></div>
            <div class="addq-choice"><input type="text" placeholder="選択肢3" required></div>
            <div class="addq-choice"><input type="text" placeholder="選択肢4" required></div>
            <label class="addq-note">かんたんな解説（省略可）</label>
            <input type="text" id="addqExplain" placeholder="例：光合成は葉緑体で行われる">
            <button type="submit">ノートに追加</button>
            <span class="addq-note" id="addqMsg"></span>
          </form>

          <div class="custom-list">
            <div class="custom-list-head">追加した問題（けせます）</div>
            <div class="custom-items" id="customItems"></div>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>

<div class="evolve-toast" id="evolveToast"></div>

<script>
(function(){
  "use strict";

  var STAGES = [
    { name:"たまご", need:0, caption:"問題に答えると、うまれるよ" },
    { name:"めばえ", need:15, caption:"小さな芽が出てきた" },
    { name:"わかば", need:40, caption:"葉っぱが増えてきた" },
    { name:"わかぎ", need:80, caption:"すこし逞しくなってきた" },
    { name:"たいじゅ", need:140, caption:"知識の樹に育った" }
  ];

  var SUBJECT_LABEL = { all:"全教科", eng:"英単語", math:"数学", soc:"社会・理科" };
  var GRADES = ["小6","中1","中2","中3"];
  var GRADE_LABEL = { "小6":"小6（復習）", "中1":"中1", "中2":"中2", "中3":"中3" };

  var BANK = {
    eng: {
      "小6": {
        "基本の単語": [

  var STORE_KEY = "sodatemon_state_v1";
  var CUSTOM_KEY = "sodatemon_custom_v3";

  function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

  function loadState(){
    var def = { exp:0, correct:0, total:0, streak:0, stampDate:todayStr(), stampCount:0 };
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return def;
      var s = JSON.parse(raw);
      if(s.stampDate !== todayStr()){ s.stampDate = todayStr(); s.stampCount = 0; }
      return Object.assign(def, s);
    }catch(e){ return def; }
  }
  function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

  function loadCustom(){
    var def = { eng:[], math:[], soc:[] };
    try{
      var raw = localStorage.getItem(CUSTOM_KEY);
      if(!raw) return def;
      var c = JSON.parse(raw);
      ["eng","math","soc"].forEach(function(k){
        if(!Array.isArray(c[k])) c[k] = [];
        c[k] = c[k].filter(function(it){ return it && typeof it.text === "string" && Array.isArray(it.choices) && it.choices.length === 4; });
      });
      return c;
    }catch(e){ return def; }
  }
  function saveCustom(){ try{ localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom)); }catch(e){} }

  var state = loadState();
  var custom = loadCustom();
  var activeTab = "all";
  var activeGrade = "all";
  var activeUnit = "__all__";
  var lastQ = null;
  var currentAnswerCorrectText = null;
  var qCounter = 0;

  function stageOf(exp){ var idx = 0; for(var i=0;i<STAGES.length;i++){ if(exp >= STAGES[i].need) idx = i; } return idx; }
  function nextThreshold(exp){ var idx = stageOf(exp); return idx < STAGES.length-1 ? STAGES[idx+1].need : STAGES[idx].need; }
  function prevThreshold(exp){ return STAGES[stageOf(exp)].need; }

  function unitsFor(subject, grade){
    if(subject === "all") return [];
    var out = [];
    var grades = grade === "all" ? GRADES : [grade];
    grades.forEach(function(g){
      var bankG = (BANK[subject] && BANK[subject][g]) || {};
      Object.keys(bankG).forEach(function(u){ if(out.indexOf(u) === -1) out.push(u); });
    });
    return out;
  }

  function pool(subject, grade, unit){
    var list = [];
    var subjects = subject === "all" ? ["eng","math","soc"] : [subject];
    var grades = grade === "all" ? GRADES : [grade];
    var useUnitFilter = subject !== "all" && unit && unit !== "__all__";
    subjects.forEach(function(s){
      grades.forEach(function(g){
        var bankG = (BANK[s] && BANK[s][g]) || {};
        var units = useUnitFilter ? (bankG[unit] ? [unit] : []) : Object.keys(bankG);
        units.forEach(function(u){
          (bankG[u] || []).forEach(function(q){
            list.push({ subject:s, grade:g, unit:u, text:q[0], choices:q[1], explanation:q[2] || "" });
          });
        });
      });
      (custom[s] || []).forEach(function(c){
        if(grade !== "all" && c.grade !== grade) return;
        if(useUnitFilter && c.unit !== unit) return;
        list.push({ subject:s, grade:c.grade, unit:c.unit, text:c.text, choices:c.choices, explanation:c.explanation || "" });
      });
    });
    return list;
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  function renderCreature(){
    var idx = stageOf(state.exp);
    var el = document.getElementById("creature");
    el.setAttribute("data-stage", String(idx));
    document.getElementById("stageName").textContent = STAGES[idx].name;
    document.getElementById("stageCaption").textContent = STAGES[idx].caption;
    var lo = prevThreshold(state.exp), hi = nextThreshold(state.exp);
    var pct = hi === lo ? 100 : Math.min(100, Math.round((state.exp-lo)/(hi-lo)*100));
    document.getElementById("expFill").style.width = pct + "%";
    document.getElementById("expText").textContent = idx === STAGES.length-1 ? (state.exp + " （最終形態）") : (state.exp + " / " + hi);
  }

  function renderStats(){
    document.getElementById("statCorrect").textContent = state.correct;
    document.getElementById("statTotal").textContent = state.total;
    document.getElementById("statStreak").textContent = state.streak;
    document.getElementById("statRate").textContent = state.total ? Math.round(state.correct/state.total*100)+"%" : "0%";
  }

  function renderStamps(justAdded){
    var row = document.getElementById("stampRow");
    row.innerHTML = "";
    var n = state.stampCount;
    var shown = Math.max(n, 6);
    for(var i=0;i<shown;i++){
      var s = document.createElement("div");
      if(i < n){ s.className = "stamp" + (justAdded && i === n-1 ? " stamp-pop" : ""); s.textContent = "合"; }
      else { s.className = "stamp empty"; s.textContent = ""; }
      row.appendChild(s);
    }
  }

  function renderAll(justStamped){ renderCreature(); renderStats(); renderStamps(justStamped); }

  function renderGradeRow(){
    var row = document.getElementById("gradeRow");
    row.innerHTML = "";

    var lbl = document.createElement("span");
    lbl.className = "chip-row-label";
    lbl.textContent = "学年";
    row.appendChild(lbl);

    var allChip = document.createElement("button");
    allChip.type = "button"; allChip.className = "unit-chip";
    allChip.style.setProperty("--chip-c", "var(--gold)");
    allChip.textContent = "すべて";
    allChip.setAttribute("aria-pressed", activeGrade === "all" ? "true" : "false");
    allChip.addEventListener("click", function(){ selectGrade("all"); });
    row.appendChild(allChip);

    GRADES.forEach(function(g){
      var chip = document.createElement("button");
      chip.type = "button"; chip.className = "unit-chip";
      chip.style.setProperty("--chip-c", "var(--gold)");
      chip.textContent = GRADE_LABEL[g];
      chip.setAttribute("aria-pressed", activeGrade === g ? "true" : "false");
      chip.addEventListener("click", function(){ selectGrade(g); });
      row.appendChild(chip);
    });
  }

  function renderUnitRow(){
    var row = document.getElementById("unitRow");
    if(activeTab === "all"){ row.hidden = true; row.innerHTML = ""; return; }
    row.hidden = false;
    row.innerHTML = "";
    var subjColor = "var(--" + activeTab + ")";

    var lbl = document.createElement("span");
    lbl.className = "chip-row-label";
    lbl.textContent = "単元";
    row.appendChild(lbl);

    var allChip = document.createElement("button");
    allChip.type = "button"; allChip.className = "unit-chip";
    allChip.style.setProperty("--chip-c", subjColor);
    allChip.textContent = "すべて";
    allChip.setAttribute("aria-pressed", activeUnit === "__all__" ? "true" : "false");
    allChip.addEventListener("click", function(){ selectUnit("__all__"); });
    row.appendChild(allChip);

    unitsFor(activeTab, activeGrade).forEach(function(u){
      var chip = document.createElement("button");
      chip.type = "button"; chip.className = "unit-chip";
      chip.style.setProperty("--chip-c", subjColor);
      chip.textContent = u;
      chip.setAttribute("aria-pressed", activeUnit === u ? "true" : "false");
      chip.addEventListener("click", function(){ selectUnit(u); });
      row.appendChild(chip);
    });
  }

  function newQuestion(){
    var list = pool(activeTab, activeGrade, activeUnit);
    if(list.length === 0){
      document.getElementById("qText").textContent = "この条件の問題はまだないよ。学年か単元をかえてみてね。";
      document.getElementById("choices").innerHTML = "";
      return;
    }
    var q;
    do { q = list[Math.floor(Math.random()*list.length)]; }
    while(list.length > 1 && lastQ && q.text === lastQ.text);
    lastQ = q;
    qCounter++;

    document.getElementById("subjectChip").textContent = SUBJECT_LABEL[q.subject] + " ・ " + GRADE_LABEL[q.grade] + " ・ " + q.unit;
    document.getElementById("qIndex").textContent = qCounter;
    document.getElementById("qText").textContent = q.text;

    var order = shuffle([0,1,2,3]);
    currentAnswerCorrectText = q.choices[0];
    var currentExplanation = q.explanation;

    var wrap = document.getElementById("choices");
    wrap.innerHTML = "";
    order.forEach(function(origIdx){
      var btn = document.createElement("button");
      btn.className = "choice"; btn.type = "button";
      btn.textContent = q.choices[origIdx];
      btn.addEventListener("click", function(){ onAnswer(btn, origIdx === 0, wrap, currentExplanation); });
      wrap.appendChild(btn);
    });

    document.getElementById("feedback").className = "feedback";
    document.getElementById("nextBtn").className = "next-btn";
  }

  function onAnswer(btn, isCorrect, wrap, explanation){
    var buttons = wrap.querySelectorAll(".choice");
    buttons.forEach(function(b){ b.disabled = true; if(b.textContent === currentAnswerCorrectText) b.classList.add("correct"); });
    if(!isCorrect) btn.classList.add("wrong");

    var beforeStage = stageOf(state.exp);
    state.total++;
    if(isCorrect){
      state.correct++; state.streak++;
      state.exp += 10 + Math.min(state.streak-1, 5)*2;
      state.stampCount++;
    } else {
      state.streak = 0; state.exp += 2;
    }
    saveState();

    var fb = document.getElementById("feedback");
    var fstamp = document.getElementById("fstamp");
    var ftext = document.getElementById("feedbackText");
    var explainEl = document.getElementById("explainText");

    if(isCorrect){
      fb.className = "feedback show ok";
      fstamp.textContent = "合";
      ftext.textContent = state.streak >= 3 ? ("せいかい！ " + state.streak + "連続、ノリノリだね") : "せいかい！";
    } else {
      fb.className = "feedback show ng";
      fstamp.textContent = "惜";
      ftext.textContent = "おしい、正解は「" + currentAnswerCorrectText + "」だよ";
    }
    explainEl.innerHTML = explanation ? ("<b>解説　</b>" + explanation) : "";

    document.getElementById("nextBtn").className = "next-btn show";
    renderAll(isCorrect);

    var afterStage = stageOf(state.exp);
    if(afterStage > beforeStage){
      var toast = document.getElementById("evolveToast");
      toast.textContent = "そだてもんが「" + STAGES[afterStage].name + "」に育った！";
      toast.className = "evolve-toast show";
      setTimeout(function(){ toast.className = "evolve-toast"; }, 2600);
    }
  }

  function fillAddqUnits(){
    var subj = document.getElementById("addqSubject").value;
    var grade = document.getElementById("addqGrade").value;
    var sel = document.getElementById("addqUnit");
    var keep = sel.value;
    sel.innerHTML = "";
    var units = Object.keys((BANK[subj] && BANK[subj][grade]) || {});
    units.forEach(function(u){ var opt = document.createElement("option"); opt.value = u; opt.textContent = u; sel.appendChild(opt); });
    var custom_opt = document.createElement("option");
    custom_opt.value = "自由追加"; custom_opt.textContent = "自由追加（その他）";
    sel.appendChild(custom_opt);
    if(units.indexOf(keep) !== -1) sel.value = keep;
  }

  function renderCustomList(){
    var box = document.getElementById("customItems");
    box.innerHTML = "";
    var all = [];
    ["eng","math","soc"].forEach(function(s){ (custom[s]||[]).forEach(function(c){ all.push(c); }); });
    if(all.length === 0){
      var e = document.createElement("div");
      e.className = "custom-empty";
      e.textContent = "まだ追加した問題はないよ。";
      box.appendChild(e);
      return;
    }
    all.forEach(function(c){
      var row = document.createElement("div");
      row.className = "custom-item";
      var meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = "[" + SUBJECT_LABEL[c.subject] + "・" + GRADE_LABEL[c.grade] + "・" + c.unit + "]";
      var txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = c.text;
      var del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.textContent = "×";
      del.title = "この問題を削除";
      del.addEventListener("click", function(){ deleteCustom(c.subject, c.id); });
      row.appendChild(meta); row.appendChild(txt); row.appendChild(del);
      box.appendChild(row);
    });
  }

  function deleteCustom(subject, id){
    custom[subject] = (custom[subject]||[]).filter(function(c){ return c.id !== id; });
    saveCustom();
    renderCustomList();
    if(lastQ && lastQ.subject === subject) { lastQ = null; newQuestion(); }
  }

  function selectUnit(u){ activeUnit = u; renderUnitRow(); newQuestion(); }

  function selectGrade(g){
    activeGrade = g;
    activeUnit = "__all__";
    renderGradeRow();
    renderUnitRow();
    newQuestion();
  }

  function selectTab(k){
    activeTab = k;
    activeUnit = "__all__";
    document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", t.dataset.k === k ? "true" : "false"); });
    if(k !== "all") document.getElementById("addqSubject").value = k;
    fillAddqUnits();
    renderUnitRow();
    lastQ = null;
    newQuestion();
  }

  document.querySelectorAll(".tab").forEach(function(t){ t.addEventListener("click", function(){ selectTab(t.dataset.k); }); });
  document.getElementById("nextBtn").addEventListener("click", newQuestion);
  document.getElementById("addqSubject").addEventListener("change", fillAddqUnits);
  document.getElementById("addqGrade").addEventListener("change", fillAddqUnits);

  document.getElementById("addqForm").addEventListener("submit", function(e){
    e.preventDefault();
    var subj = document.getElementById("addqSubject").value;
    var grade = document.getElementById("addqGrade").value;
    var unit = document.getElementById("addqUnit").value;
    var text = document.getElementById("addqText").value.trim();
    var explain = document.getElementById("addqExplain").value.trim();
    var inputs = e.target.querySelectorAll(".addq-choice input");
    var choices = Array.prototype.map.call(inputs, function(i){ return i.value.trim(); });
    if(!text || choices.some(function(c){ return !c; })) return;
    if(!custom[subj]) custom[subj] = [];
    custom[subj].push({ id: Date.now() + "-" + Math.floor(Math.random()*10000), grade:grade, unit:unit, text:text, choices:choices, explanation:explain });
    saveCustom();
    renderCustomList();
    document.getElementById("addqMsg").textContent = "追加したよ（" + SUBJECT_LABEL[subj] + "・" + GRADE_LABEL[grade] + "・" + unit + "）";

    var subjSel = subj, gradeSel = grade, unitSel = unit;
    e.target.reset();
    document.getElementById("addqSubject").value = subjSel;
    document.getElementById("addqGrade").value = gradeSel;
    fillAddqUnits();
    document.getElementById("addqUnit").value = unitSel;

    if((activeTab === "all" || activeTab === subj) && (activeGrade === "all" || activeGrade === grade)) renderUnitRow();
  });

  fillAddqUnits();
  renderCustomList();
  renderAll(false);
  renderGradeRow();
  selectTab("all");
})();
</script>
