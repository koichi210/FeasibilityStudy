<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おぐそーのカードゲーム PoC</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="title">🎴 おぐそーのカードゲーム <span class="tag">PoC</span></div>
  <div class="turninfo">
    <span id="turnLabel">ターン -</span>
    <span id="whoseTurn" class="badge">-</span>
  </div>
  <button id="optionBtn" class="btn btn-ghost">⚙️ オプション</button>
  <button id="newGameBtn" class="btn btn-ghost">🔄 新しいゲーム</button>
</header>

<main class="layout">

  <section class="board">

    <!-- ================= 相手 ================= -->
    <div class="side side-opponent">
      <div class="trainer">
        <div class="trainer-head">
          <span class="tname" id="opName">CPU</span>
          <span class="thp" id="opHpText">200 / 200</span>
        </div>
        <div class="hpbar big"><div class="hpfill enemy" id="opHpFill"></div></div>
        <div class="counts" id="opCounts"></div>
      </div>

      <div class="zone">
        <div class="zone-label">🛡️ ベンチ</div>
        <div class="slots" id="opBench"></div>
      </div>
      <div class="zone">
        <div class="zone-label">🏟️ バトル場</div>
        <div class="slots" id="opBattle"></div>
      </div>
    </div>

    <div class="divider"><span>VS</span></div>

    <!-- ================= 自分 ================= -->
    <div class="side side-me">
      <div class="zone">
        <div class="zone-label">🏟️ バトル場</div>
        <div class="slots" id="myBattle"></div>
      </div>
      <div class="zone">
        <div class="zone-label">🛡️ ベンチ <span class="hint">（クリックで交代）</span></div>
        <div class="slots" id="myBench"></div>
      </div>

      <div class="trainer">
        <div class="trainer-head">
          <span class="tname" id="myName">あなた</span>
          <span class="thp" id="myHpText">200 / 200</span>
        </div>
        <div class="hpbar big"><div class="hpfill mine" id="myHpFill"></div></div>
        <div class="counts" id="myCounts"></div>
      </div>
    </div>

    <!-- ================= 手札 ================= -->
    <div class="hand-zone">
      <div class="zone-label">🎒 アイテム手札
        <span class="hint">（クリックで使用・1ターン1枚／マウスを乗せると拡大🔍）</span>
      </div>
      <div class="hand" id="myHand"></div>
    </div>

    <div class="actionbar">
      <button id="attackBtn" class="btn btn-attack" disabled>⚔️ 攻撃</button>
      <button id="endTurnBtn" class="btn btn-end" disabled>⏭️ ターン終了</button>
      <span class="acthint" id="actHint"></span>
    </div>

  </section>

  <!-- ================= 右パネル（タブ切り替え） ================= -->
  <aside class="sidepane">
    <div class="tabs">
      <button class="tab active" data-tab="log">📜 ログ</button>
      <button class="tab" data-tab="item">🎒 アイテム</button>
      <button class="tab" data-tab="monster">⚔️ モンスター</button>
    </div>

    <div class="tabbody">
      <div class="tabpanel active" id="panel-log">
        <div class="loglist" id="logList"></div>
      </div>
      <div class="tabpanel" id="panel-item">
        <div class="refbody" id="refItem">読み込み中…</div>
      </div>
      <div class="tabpanel" id="panel-monster">
        <div class="refbody" id="refMonster">読み込み中…</div>
      </div>
    </div>

    <div class="paneFoot">
      <a href="/cards" target="_blank" rel="noopener" class="poplink">
        ↗ カード図鑑を別ウィンドウで開く（印刷もできる）
      </a>
    </div>
  </aside>

</main>

<!-- ================= オプション ================= -->
<div id="optionOverlay" class="overlay hidden">
  <div class="overlay-box optbox">
    <div class="overlay-title">⚙️</div>
    <div class="overlay-text">ゲームオプション</div>

    <label class="optrow">
      <input type="checkbox" id="optAbilities">
      <span class="optlabel">⚔️ モンスターの技を使う</span>
      <span class="optdesc">
        オフにすると、J・Q・K・A の特殊能力が発動しなくなります。<br>
        ルールがシンプルになるので、はじめての人におすすめ。
      </span>
    </label>

    <label class="optrow">
      <input type="checkbox" id="optDemon">
      <span class="optlabel">👹 魔王（♠A）を使う</span>
      <span class="optdesc">
        オフにすると、♠A を出しても魔王が降臨しなくなります。<br>
        ※「モンスターの技」がオフのときは、こちらもオフになります。
      </span>
    </label>

    <div class="optnote">
      設定を変えると<b>新しいゲームが始まります</b>（いまの試合は終了します）。
    </div>

    <div class="optbtns">
      <button id="optApply" class="btn btn-attack">この設定で始める</button>
      <button id="optCancel" class="btn btn-end">キャンセル</button>
    </div>
  </div>
</div>

<!-- ================= 決着 ================= -->
<div id="overlay" class="overlay hidden">
  <div class="overlay-box">
    <div class="overlay-title" id="ovTitle">🏆</div>
    <div class="overlay-text" id="ovText"></div>
    <button id="ovBtn" class="btn btn-attack">🔄 もう一度あそぶ</button>
  </div>
</div>

<script src="/static/reference.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
